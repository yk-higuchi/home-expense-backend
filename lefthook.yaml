pre-commit:
  parallel: true
  jobs:
    - name: openapi
      glob: "docs/openapi.yaml"
      group:
        piped: true
        jobs:
          - name: sort openapi.yaml
            run: bash scripts/sort_openapi.sh docs/openapi.yaml
            stage_fixed: true
          - name: generate openapi.schema.json
            run: node scripts/generate_json_schema.mjs docs/openapi.yaml docs/openapi.schema.json && node_modules/.bin/biome format --write docs/openapi.schema.json && git add docs/openapi.schema.json
          - name: vacuum
            run: vacuum lint -r .vacuum.yaml -d docs/openapi.yaml
    - name: biome
      glob: "*.{json,jsonc,js,mjs,md}"
      run: node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: markdownlint
      glob: "*.md"
      run: node_modules/.bin/markdownlint-cli2 {staged_files}
    - name: yamllint
      glob: "*.{yaml,yml}"
      run: yamllint --strict {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yaml,yml}"
      run: actionlint {staged_files}
    - name: hadolint
      glob: "*Dockerfile"
      run: hadolint {staged_files}
    - name: sqlfluff
      glob: "flyway/migration/*.sql"
      exclude:
        - "flyway/migration/V1.0.0__initial.sql"
        - "flyway/migration/V1.0.1__add_index.sql"
        - "flyway/migration/V1.1.0__income.sql"
      run: sqlfluff lint {staged_files}
    - name: ruff
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
    - name: spotless
      glob: "app/*.{java,kts}"
      root: "app/"
      run: ./gradlew --console=plain -q spotlessApply
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}
