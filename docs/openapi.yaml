          type: string
        name:
          maxLength: 512
          type: string
      required:
        - id
        - name
        - category
      type: object
    ExpenseGetResponse:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        description:
          maxLength: 512
          type: string
        expense_attribute:
