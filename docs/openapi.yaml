      responses:
        "201":
          description: 収入属性を登録した
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "500":
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - Income Attributes
      summary: 収入属性の一覧で使える操作を取得する
      description: 使えるメソッドを Allow ヘッダーで、PATCH で受け付けるパッチの形式を Accept-Patch ヘッダーで返します（RFC 5789 §3.1）。
      operationId: optionsIncomeAttributes
      responses:
        "200":
          description: 成功
          headers:
            Accept-Patch:
              $ref: '#/components/headers/AcceptPatch'
