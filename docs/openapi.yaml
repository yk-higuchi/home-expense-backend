      summary: 収入属性を登録する
      description: 収入属性を登録します。登録した属性は、並びの末尾に入ります。名前は重複できません（重複時は 409）。100 件まで登録でき、超える場合も 409 です。登録した属性の URI は Location ヘッダーで返します。
      operationId: createIncomeAttribute
      requestBody:
        content:
          application/json:
            schema:
