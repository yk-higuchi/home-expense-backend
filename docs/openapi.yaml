        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/incomes:
    get:
      tags:
        - Incomes
      summary: 収入の一覧を取得する
      description: 収入の一覧をページ単位で返します。年で絞り込めます。ページ送りのリンクは Link ヘッダーで返します。
      operationId: getIncomes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - description: 年で絞り込む
          in: query
          name: year
          schema:
            format: int32
            maximum: 2200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeListResponse'
          description: 成功
          headers:
            Link:
              $ref: '#/components/headers/Link'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Incomes
      summary: 収入を登録する
      description: 収入を登録します。attribute_id には存在する収入属性を指定します（存在しない場合は 422）。登録した収入の URI は Location ヘッダーで返します。
      operationId: createIncome
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomePostRequest'
        description: 登録する収入
        required: true
      responses:
        "201":
          description: 収入を登録した
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "422":
          $ref: '#/components/responses/UnprocessableContent'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/incomes/{id}:
    get:
      tags:
        - Incomes
      summary: ID を指定して収入を取得する
      description: 収入を属性とともに返します。ETag ヘッダーにはバージョンが入っており、If-Match に使います。
      operationId: getIncomeById
      parameters:
        - $ref: '#/components/parameters/IncomeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeGetResponse'
          description: 成功
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Incomes
      summary: 収入を更新する
      description: 収入を置き換えます。現在の ETag を If-Match に指定する必要があります。attribute_id には存在する収入属性を指定します。
      operationId: updateIncome
      parameters:
        - $ref: '#/components/parameters/IncomeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomePutRequest'
        description: 収入の全項目
        required: true
      responses:
        "204":
          description: 収入を更新した
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "422":
          $ref: '#/components/responses/UnprocessableContent'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Incomes
      summary: 収入を削除する
      description: 収入を削除します。個別取得で得た現在の ETag を If-Match に指定する必要があります。
      operationId: deleteIncome
      parameters:
        - $ref: '#/components/parameters/IncomeId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        "204":
          description: 収入を削除した
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "500":
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    AttributeAmountResponse:
      properties:
        amount:
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          type: string
        attribute_name:
          maxLength: 512
          type: string
      required:
        - attribute_id
        - attribute_name
        - amount
      type: object
    AttributeBreakdownResponse:
      properties:
        breakdown:
          description: 属性ごとの金額（属性の並び順）。期間内にデータがない属性は含みません。
          items:
            $ref: '#/components/schemas/AttributeAmountResponse'
          type: array
        total:
          description: 内訳の金額の合計
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
      required:
        - total
        - breakdown
      type: object
    BalanceSeriesPointResponse:
      properties:
        expense_total:
          description: fixed_expense_total と variable_expense_total の合計
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        fixed_expense_total:
          description: 区間内の固定費の合計
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        income_total:
          description: 区間内の収入の合計
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        net:
          description: 収支差額。income_total から expense_total を引いた値（負になることがあります）
          format: int64
          maximum: 1000000000000
          minimum: -1000000000000
          type: integer
        period:
          $ref: '#/components/schemas/PeriodResponse'
        variable_expense_total:
          description: 区間内の変動費の合計
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
      required:
        - period
        - income_total
        - fixed_expense_total
        - variable_expense_total
        - expense_total
        - net
      type: object
    BalanceSeriesResponse:
      properties:
        granularity:
          enum:
            - day
            - week
            - month
            - quarter
            - year
          type: string
        items:
          items:
            $ref: '#/components/schemas/BalanceSeriesPointResponse'
          maxItems: 366
          type: array
      required:
        - granularity
        - items
      type: object
    BalanceStatisticsResponse:
      properties:
        expense_total:
          description: fixed_expense.total と variable_expense.total の合計
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        fixed_expense:
          $ref: '#/components/schemas/AttributeBreakdownResponse'
        income:
          $ref: '#/components/schemas/AttributeBreakdownResponse'
        net:
          description: 収支差額。income.total から expense_total を引いた値（負になることがあります）
          format: int64
          maximum: 1000000000000
          minimum: -1000000000000
          type: integer
        period:
          $ref: '#/components/schemas/PeriodResponse'
        variable_expense:
          $ref: '#/components/schemas/AttributeBreakdownResponse'
      required:
        - period
        - income
        - fixed_expense
        - variable_expense
        - expense_total
        - net
      type: object
    ExpenseAttributeGetResponse:
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        id:
          format: uuid
          maxLength: 36
          type: string
        name:
          maxLength: 512
          type: string
      required:
        - id
        - name
        - category
      type: object
    ExpenseAttributeListPatchRequest:
      description: 移動の一覧。前から順に適用します。
      items:
        $ref: '#/components/schemas/ExpenseAttributeMoveOperation'
      maxItems: 100
      type: array
    ExpenseAttributeListResponse:
      properties:
        expense_attributes:
          items:
            $ref: '#/components/schemas/ExpenseAttributeGetResponse'
          maxItems: 100
          type: array
      required:
        - expense_attributes
      type: object
    ExpenseAttributeMoveOperation:
      additionalProperties: true
      description: JSON Patch（RFC 6902）の move。`expense_attributes` の要素を、from の位置から path の位置へ移動します（`-` は末尾）。操作で定義されていない項目は無視します（RFC 6902 §4）。
      properties:
        from:
          description: 移動元の要素の JSON Pointer
          maxLength: 40
          pattern: ^/expense_attributes/(0|[1-9][0-9]{0,8})$
          type: string
        op:
          description: 操作（move だけを受け付けます）
          enum:
            - move
          type: string
        path:
          description: 移動先の位置の JSON Pointer
          maxLength: 40
          pattern: ^/expense_attributes/(0|[1-9][0-9]{0,8}|-)$
          type: string
      required:
        - op
        - from
        - path
      type: object
    ExpenseAttributePostRequest:
      additionalProperties: false
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        name:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
      required:
        - name
        - category
      type: object
    ExpenseAttributePutRequest:
      additionalProperties: false
      description: 経費属性の区分は、登録後に変更できません。
      properties:
        name:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
      required:
        - name
      type: object
    ExpenseAttributeResponse:
