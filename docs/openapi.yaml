openapi: 3.2.0
info:
  title: Home Expense API
  description: |
    家計の支出と収入を管理する API です。
  contact:
    name: API Support
  license:
    name: MIT
    identifier: MIT
  version: 2.0.0 # x-release-please-version
servers:
  - url: http://localhost:8080
    description: ローカル開発用サーバー
    x-internal: true
paths:
  /v1/balance-series:
    get:
      tags:
        - Balance Series
      summary: 収支の時系列を取得する
      description: 収入・固定費・変動費・収支差額を、指定した粒度の時系列で集計して返します。各区間は from / to を含む期間全体を対象にします（例：粒度が month で from=2026-04-15 の場合、最初の区間は 2026-04-01 から始まります）。
      operationId: getBalanceSeries
      parameters:
        - description: 期間の開始日（yyyy-MM-dd）
          in: query
          name: from
          required: true
          schema:
            format: date
            maxLength: 10
            type: string
        - description: 期間の終了日（yyyy-MM-dd、この日を含む）
          in: query
          name: to
          required: true
          schema:
            format: date
            maxLength: 10
            type: string
        - description: 集計の粒度
          in: query
          name: granularity
          required: true
          schema:
            enum:
              - day
              - week
              - month
              - quarter
              - year
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSeriesResponse'
          description: 成功
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/balance-statistics:
    get:
      tags:
        - Balance Statistics
      summary: 収支の統計を取得する
      description: 指定した年（month を指定した場合はその月）の収入と支出の合計を、属性ごとの内訳とともに返します。内訳は属性の並び順（属性の一覧と同じ順）に並びます。
      operationId: getBalanceStatistics
      parameters:
        - description: 対象の年
          in: query
          name: year
          required: true
          schema:
            format: int32
            maximum: 2200
            minimum: 1
            type: integer
        - description: 対象の月。省略すると 1 年分を集計します。
          in: query
          name: month
          required: false
          schema:
            format: int32
            maximum: 12
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceStatisticsResponse'
          description: 成功
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/expense-attributes:
    get:
      tags:
        - Expense Attributes
      summary: 経費属性の一覧を取得する
      description: 経費属性を全件、並び順で返します（ページ送りはありません）。区分を指定した場合はその区分の並びを、指定しない場合は固定費の並びのあとに変動費の並びを返します。一覧の ETag を付けます。
      operationId: getExpenseAttributes
      parameters:
        - description: 区分で絞り込む（並べ替えの画面では必ず指定する）
          in: query
          name: category
          schema:
            enum:
              - 固定費
              - 変動費
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseAttributeListResponse'
          description: 成功
          headers:
            ETag:
              $ref: '#/components/headers/ListETag'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Expense Attributes
      summary: 経費属性を登録する
      description: 経費属性を登録します。登録した属性は、その区分の並びの末尾に入ります。名前は区分の中で重複できません（重複時は 409）。区分ごとに 100 件まで登録でき、超える場合も 409 です。登録した属性の URI は Location ヘッダーで返します。
      operationId: createExpenseAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseAttributePostRequest'
        description: 登録する経費属性
        required: true
      responses:
        "201":
          description: 経費属性を登録した
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "500":
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - Expense Attributes
      summary: 経費属性の一覧で使える操作を取得する
      description: 使えるメソッドを Allow ヘッダーで、PATCH で受け付けるパッチの形式を Accept-Patch ヘッダーで返します（RFC 5789 §3.1）。
      operationId: optionsExpenseAttributes
      responses:
        "200":
          description: 成功
          headers:
            Accept-Patch:
              $ref: '#/components/headers/AcceptPatch'
            Allow:
              $ref: '#/components/headers/Allow'
        "500":
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Expense Attributes
      summary: 経費属性を並べ替える
      description: 区分を指定した経費属性の一覧に、JSON Patch（RFC 6902）の move を適用して並べ替えます。一覧で受け取った ETag を If-Match に指定する必要があります。並べ替えても、属性ごとの ETag は変わりません。
      operationId: reorderExpenseAttributes
      parameters:
        - description: 並べ替える区分
          in: query
          name: category
          required: true
          schema:
            enum:
              - 固定費
              - 変動費
            type: string
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ExpenseAttributeListPatchRequest'
        description: 移動の一覧
        required: true
      responses:
        "204":
          description: 並べ替えた
          headers:
            ETag:
              $ref: '#/components/headers/ListETag'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/PatchConflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "415":
          $ref: '#/components/responses/UnsupportedPatchMediaType'
        "422":
          $ref: '#/components/responses/UnprocessablePatch'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/expense-attributes/{id}:
    get:
      tags:
        - Expense Attributes
      summary: ID を指定して経費属性を取得する
      description: 経費属性を返します。ETag ヘッダーにはバージョンが入っており、If-Match に使います。
      operationId: getExpenseAttributeById
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseAttributeGetResponse'
          description: 成功
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Expense Attributes
      summary: 経費属性を更新する
      description: 経費属性の名前を変更します（区分は変更できません）。現在の ETag を If-Match に指定する必要があります。名前は区分の中で重複できません。
      operationId: updateExpenseAttribute
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseAttributePutRequest'
        description: 経費属性の新しい名前
        required: true
      responses:
        "204":
          description: 経費属性を更新した
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Expense Attributes
      summary: 経費属性を削除する
      description: 経費属性を削除します。個別取得で得た現在の ETag を If-Match に指定する必要があります。この属性を参照している経費がある間は 409 になります。
      operationId: deleteExpenseAttribute
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        "204":
          description: 経費属性を削除した
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/expenses:
    get:
      tags:
        - Expenses
      summary: 経費の一覧を取得する
      description: 経費の一覧をページ単位で返します。条件で絞り込めます。ページ送りのリンクは Link ヘッダーで返します。
      operationId: getExpenses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - description: 年で絞り込む
          in: query
          name: year
          schema:
            format: int32
            maximum: 2200
            minimum: 1
            type: integer
        - description: 月で絞り込む。year の指定が必要です（ない場合は 400）
          in: query
          name: month
          schema:
            format: int32
            maximum: 12
            minimum: 1
            type: integer
        - description: 経費の区分で絞り込む
          in: query
          name: category
          schema:
            enum:
              - 固定費
              - 変動費
            type: string
        - description: 経費属性の ID で絞り込む
          in: query
          name: attribute_id
          schema:
            format: uuid
            maxLength: 36
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListResponse'
          description: 成功
          headers:
            Link:
              $ref: '#/components/headers/Link'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Expenses
      summary: 経費を登録する
      description: 経費を登録します。attribute_id には存在する経費属性を指定します（存在しない場合は 422）。登録した経費の URI は Location ヘッダーで返します。
      operationId: createExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePostRequest'
        description: 登録する経費
        required: true
      responses:
        "201":
          description: 経費を登録した
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "422":
          $ref: '#/components/responses/UnprocessableContent'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/expenses/{id}:
    get:
      tags:
        - Expenses
      summary: ID を指定して経費を取得する
      description: 経費を属性とともに返します。ETag ヘッダーにはバージョンが入っており、If-Match に使います。
      operationId: getExpenseById
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseGetResponse'
          description: 成功
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Expenses
      summary: 経費を更新する
      description: 経費を置き換えます。現在の ETag を If-Match に指定する必要があります。attribute_id には存在する経費属性を指定します。
      operationId: updateExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePutRequest'
        description: 経費の全項目
        required: true
      responses:
        "204":
          description: 経費を更新した
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "422":
          $ref: '#/components/responses/UnprocessableContent'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Expenses
      summary: 経費を削除する
      description: 経費を削除します。個別取得で得た現在の ETag を If-Match に指定する必要があります。
      operationId: deleteExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        "204":
          description: 経費を削除した
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/income-attributes:
    get:
      tags:
        - Income Attributes
      summary: 収入属性の一覧を取得する
      description: 収入属性を全件、並び順で返します（ページ送りはありません）。一覧の ETag を付けます。
      operationId: getIncomeAttributes
      responses:
