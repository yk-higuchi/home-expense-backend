            $ref: '#/components/schemas/ExpenseGetResponse'
          maxItems: 100
          type: array
      required:
        - expenses
      type: object
    ExpensePostRequest:
      additionalProperties: false
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
        description:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
        payment_date:
          example: "2026-04-10"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - payment_date
        - attribute_id
      type: object
    ExpensePutRequest:
      additionalProperties: false
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
        description:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
        payment_date:
          example: "2026-04-10"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - payment_date
        - attribute_id
      type: object
    IncomeAttributeGetResponse:
      properties:
        id:
          format: uuid
          maxLength: 36
          type: string
        name:
          maxLength: 512
          type: string
      required:
        - id
        - name
      type: object
    IncomeAttributeListPatchRequest:
      description: 移動の一覧。前から順に適用します。
      items:
        $ref: '#/components/schemas/IncomeAttributeMoveOperation'
      maxItems: 100
      type: array
    IncomeAttributeListResponse:
      properties:
        income_attributes:
          items:
            $ref: '#/components/schemas/IncomeAttributeGetResponse'
          maxItems: 100
          type: array
      required:
        - income_attributes
      type: object
    IncomeAttributeMoveOperation:
      additionalProperties: true
      description: JSON Patch（RFC 6902）の move。`income_attributes` の要素を、from の位置から path の位置へ移動します（`-` は末尾）。操作で定義されていない項目は無視します（RFC 6902 §4）。
      properties:
        from:
          description: 移動元の要素の JSON Pointer
          maxLength: 40
          pattern: ^/income_attributes/(0|[1-9][0-9]{0,8})$
          type: string
        op:
          description: 操作（move だけを受け付けます）
          enum:
            - move
          type: string
        path:
          description: 移動先の位置の JSON Pointer
          maxLength: 40
          pattern: ^/income_attributes/(0|[1-9][0-9]{0,8}|-)$
          type: string
      required:
        - op
        - from
        - path
      type: object
    IncomeAttributePostRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
      required:
        - name
      type: object
    IncomeAttributePutRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
      required:
        - name
      type: object
    IncomeAttributeResponse:
      properties:
        id:
          format: uuid
          maxLength: 36
          type: string
        name:
          maxLength: 512
          type: string
      required:
        - id
        - name
      type: object
    IncomeGetResponse:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        description:
          maxLength: 512
          type: string
        id:
          format: uuid
          maxLength: 36
          type: string
        income_attribute:
          $ref: '#/components/schemas/IncomeAttributeResponse'
        receive_date:
          format: date
          maxLength: 10
          type: string
      required:
        - id
        - description
        - amount
        - receive_date
        - income_attribute
      type: object
    IncomeListResponse:
      properties:
        incomes:
          items:
            $ref: '#/components/schemas/IncomeGetResponse'
          maxItems: 100
          type: array
      required:
        - incomes
      type: object
    IncomePostRequest:
      additionalProperties: false
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
        description:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
        receive_date:
          example: "2026-04-25"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - receive_date
        - attribute_id
      type: object
    IncomePutRequest:
      additionalProperties: false
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
        description:
          maxLength: 512
          minLength: 1
          pattern: \S
          type: string
        receive_date:
          example: "2026-04-25"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - receive_date
        - attribute_id
      type: object
    PeriodResponse:
      description: 期間（from と to の日付を含む）
      properties:
        from:
          description: 開始日（この日を含む）
          format: date
          type: string
        to:
          description: 終了日（この日を含む）
          format: date
          type: string
      required:
        - from
        - to
      type: object
    ProblemDetail:
      description: RFC 9457 の Problem Details 形式のエラー。`instance` は返しません。個々の発生を特定するには `trace_id` を使います。
      properties:
        detail:
          description: この発生に固有の、人が読むための説明
          example: descriptionは必須入力です
          maxLength: 1024
          type: string
        status:
          description: HTTP ステータスコード
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
        title:
          description: 問題の種類を表す、人が読むための短い要約
          example: Bad Request
          maxLength: 256
          type: string
        trace_id:
          description: リクエストの W3C Trace Context の trace-id。サーバー側のトレースと突き合わせるために使います（拡張メンバー）
          example: 4bf92f3577b34da6a3ce929d0e0e4736
          maxLength: 32
          pattern: ^[0-9a-f]{32}$
          type: string
        type:
          description: 問題の種類を識別する URI 参照
          example: about:blank
          format: uri
          maxLength: 2048
          type: string
      required:
        - type
        - title
        - status
      type: object
  responses:
    BadRequest:
      description: 入力が不正
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: descriptionは必須入力です
            status: 400
            title: Bad Request
            type: about:blank
    Conflict:
      description: リソースの競合（名前の重複、登録件数の上限、参照中の属性の削除など）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 既に登録されています
            status: 409
            title: Conflict
            type: about:blank
    InternalServerError:
      description: 想定外のサーバーエラー。詳細は返しません。サーバーのログとの突き合わせには trace_id を使います。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: サーバ内部エラーが発生しました
            status: 500
            title: Internal Server Error
            type: about:blank
    NotFound:
      description: リソースが見つからない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 経費が見つかりません
            status: 404
            title: Not Found
            type: about:blank
    PatchConflict:
      description: 今の一覧に対して JSON Patch を適用できない（移動元・移動先の位置が範囲外。RFC 5789 §2.2 の Conflicting state）。最新の一覧を取得して再試行してください。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 移動元の位置 12 は範囲外です
            status: 409
            title: Conflict
            type: about:blank
    PreconditionFailed:
      description: |
        `If-Match` の条件が偽になった（RFC 9110 §13.1.1）。指定したどの entity-tag も、現在の `ETag` と強い比較で一致しません（弱いタグは一致しません）。
        クライアントはリソースを取得し直して最新の `ETag` を得てから再試行してください。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 指定されたバージョンは既に更新されています。最新を取得して再試行してください
            status: 412
            title: Precondition Failed
            type: about:blank
    PreconditionRequired:
      description: '`If-Match` ヘッダーがない（RFC 6585 §3）。`If-Match` の形式が不正な場合は 400 になります。'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: If-Matchヘッダーは必須です
            status: 428
            title: Precondition Required
            type: about:blank
    UnprocessableContent:
      description: 存在しない属性を参照している（RFC 9110 §15.5.21）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 指定された経費属性が存在しません
            status: 422
            title: Unprocessable Content
            type: about:blank
    UnprocessablePatch:
      description: JSON Patch を処理できない（move 以外の操作、対象外のパス）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: JSON Patch は expense_attributes の要素を移動する move だけを指定できます
            status: 422
            title: Unprocessable Content
            type: about:blank
    UnsupportedMediaType:
      description: リクエスト本文が application/json で送られていない。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: サポートされていないメディアタイプです
            status: 415
            title: Unsupported Media Type
            type: about:blank
    UnsupportedPatchMediaType:
      description: リクエスト本文の形式が application/json-patch+json でない。受け付ける形式を Accept-Patch ヘッダーで返します（RFC 5789 §2.2）。
      headers:
        Accept-Patch:
          $ref: '#/components/headers/AcceptPatch'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: サポートされていないメディアタイプです
            status: 415
            title: Unsupported Media Type
            type: about:blank
  parameters:
    ExpenseAttributeId:
      name: id
      in: path
      description: 経費属性の ID
      required: true
      schema:
        format: uuid
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        type: string
    ExpenseId:
      name: id
      in: path
      description: 経費の ID
      required: true
      schema:
        format: uuid
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: |
        個別取得または一覧のレスポンスの `ETag` ヘッダーで受け取った entity-tag（RFC 9110 §13.1.1）。強い比較で照合します。
        `*`（条件なし）または `"<ETag>", "<ETag>"` のようなカンマ区切りの一覧を指定できます。
        ない場合は 428、形式が不正な場合は 400、一致しない場合は 412 になります。
      required: true
      schema:
        maxLength: 128
        pattern: ^(\*|(W/)?"[^"]*"(\s*,\s*(W/)?"[^"]*")*)$
        type: string
    IncomeAttributeId:
      name: id
      in: path
      description: 収入属性の ID
      required: true
      schema:
        format: uuid
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        type: string
    IncomeId:
      name: id
      in: path
      description: 収入の ID
      required: true
      schema:
        format: uuid
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        type: string
    Page:
      name: page
      in: query
      description: ページ番号
      schema:
        default: 1
        format: int32
        maximum: 1000000
        minimum: 1
        type: integer
    PerPage:
      name: per_page
      in: query
      description: 1 ページあたりの件数
      schema:
        default: 20
        format: int32
        maximum: 100
        minimum: 1
        type: integer
  headers:
    AcceptPatch:
      description: PATCH で受け付けるパッチの形式（RFC 5789 §3.1）。
      schema:
        example: application/json-patch+json
        maxLength: 64
        type: string
    Allow:
      description: このリソースで使えるメソッド（RFC 9110 §10.2.1）。
      schema:
        example: GET, HEAD, OPTIONS, PATCH, POST
        maxLength: 128
        type: string
    ETag:
      description: |
        リソースのドキュメントのダイジェスト。ドキュメント（PUT の本文と同じ項目）を JCS（RFC 8785）で正規化し、SHA-256 を base64url（パディングなし）で表した強い ETag です（RFC 9110 §8.8.3）。
        内容が変わらなければ値も変わりません。以降の `PUT` / `DELETE` リクエストでは、この値を `If-Match` に指定します。
      schema:
        example: '"ungWv48Bz-pBQUDeXa4iI7ADYaOWF3qctBD_YfIAFa0"'
        maxLength: 45
        pattern: ^"[A-Za-z0-9_-]{43}"$
        type: string
    Link:
      description: ページ送りのリンク（RFC 8288）。関係の種類は `self`、`first`、`last` と、該当する場合の `prev` / `next` です。リンクはリクエストのクエリパラメータ（絞り込み条件）を保ち、`page` / `per_page` だけを置き換えます。
      schema:
        maxLength: 2048
        type: string
    ListETag:
      description: |
        一覧の本文のダイジェスト。レスポンスの本文を JCS（RFC 8785）で正規化し、SHA-256 を base64url（パディングなし）で表した強い ETag です。
        並べ替え・登録・削除・名前の変更で変わります。並べ替えの PATCH では、この値を `If-Match` に指定します。
      schema:
        example: '"ungWv48Bz-pBQUDeXa4iI7ADYaOWF3qctBD_YfIAFa0"'
        maxLength: 45
        pattern: ^"[A-Za-z0-9_-]{43}"$
        type: string
    Location:
      description: 登録したリソースの URI
      schema:
        maxLength: 2048
        type: string
