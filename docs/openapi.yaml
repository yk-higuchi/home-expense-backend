openapi: 3.1.0
info:
  title: Home Expense API
  description: |
    API for managing home expenses and income.
  contact:
    name: API Support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local development server
    x-internal: true
paths:
  /v1/balance-series:
    get:
      tags:
        - Balance Series
      summary: Get balance time series
      description: Retrieve income, fixed expense, variable expense and net balance aggregated as a time series with the specified granularity. Each bucket covers the whole period that contains from / to (e.g. month granularity with from=2026-04-15 starts at 2026-04-01).
      operationId: getBalanceSeries
      parameters:
        - description: Start date of the period (yyyy-MM-dd)
          in: query
          name: from
          required: true
          schema:
            format: date
            maxLength: 10
            type: string
        - description: End date of the period (yyyy-MM-dd, inclusive)
          in: query
          name: to
          required: true
          schema:
            format: date
            maxLength: 10
            type: string
        - description: Aggregation granularity
          in: query
          name: granularity
          required: true
          schema:
            enum:
              - day
              - week
              - month
              - quarter
              - year
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSeriesResponse'
          description: Successful response
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/balance-statistics:
    get:
      tags:
        - Balance Statistics
      summary: Get balance statistics
      description: Retrieve income and expense totals with per-attribute breakdowns for a year, or for a month when month is specified. Breakdowns are sorted by amount in descending order.
      operationId: getBalanceStatistics
      parameters:
        - description: Target year
          in: query
          name: year
          required: true
          schema:
            format: int32
            maximum: 2200
            minimum: 1
            type: integer
        - description: Target month. When omitted, the whole year is aggregated.
          in: query
          name: month
          required: false
          schema:
            format: int32
            maximum: 12
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceStatisticsResponse'
          description: Successful response
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/expense-attributes:
    get:
      tags:
        - Expense Attributes
      summary: Get list of expense attributes
      operationId: getExpenseAttributes
      parameters:
        - description: Filter by category
          in: query
          name: category
          schema:
            enum:
              - 固定費
              - 変動費
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseAttributeListResponse'
          description: Successful response
          headers:
            Link:
              $ref: '#/components/headers/Link'
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Expense Attributes
      summary: Create a new expense attribute
      operationId: createExpenseAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseAttributePostRequest'
        required: true
      responses:
        "201":
          description: Expense attribute created successfully
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/expense-attributes/{id}:
    get:
      tags:
        - Expense Attributes
      summary: Get expense attribute by ID
      operationId: getExpenseAttributeById
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseAttributeGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Expense Attributes
      summary: Update an expense attribute
      operationId: updateExpenseAttribute
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseAttributePutRequest'
        required: true
      responses:
        "204":
          description: Expense attribute updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Expense Attributes
      summary: Delete an expense attribute
      operationId: deleteExpenseAttribute
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
      responses:
        "204":
          description: Expense attribute deleted successfully
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/expenses:
    get:
      tags:
        - Expenses
      summary: Get list of expenses
      description: Retrieve a paginated list of expenses with optional filters
      operationId: getExpenses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - description: Filter by year
          in: query
          name: year
          schema:
            format: int32
            maximum: 2200
            minimum: 1
            type: integer
        - description: Filter by month
          in: query
          name: month
          schema:
            format: int32
            maximum: 12
            minimum: 1
            type: integer
        - description: Filter by expense category
          in: query
          name: category
          schema:
            enum:
              - 固定費
              - 変動費
            type: string
        - description: Filter by expense attribute ID
          in: query
          name: attribute_id
          schema:
            format: uuid
            maxLength: 36
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListResponse'
          description: Successful response
          headers:
            Link:
              $ref: '#/components/headers/Link'
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Expenses
      summary: Create a new expense
      operationId: createExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePostRequest'
        required: true
      responses:
        "201":
          description: Expense created successfully
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/expenses/{id}:
    get:
      tags:
        - Expenses
      summary: Get expense by ID
      operationId: getExpenseById
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Expenses
      summary: Update an expense
      operationId: updateExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePutRequest'
        required: true
      responses:
        "204":
          description: Expense updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Expenses
      summary: Delete an expense
      operationId: deleteExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        "204":
          description: Expense deleted successfully
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/income-attributes:
    get:
      tags:
        - Income Attributes
      summary: Get list of income attributes
      operationId: getIncomeAttributes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeAttributeListResponse'
          description: Successful response
          headers:
            Link:
              $ref: '#/components/headers/Link'
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Income Attributes
      summary: Create a new income attribute
      operationId: createIncomeAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeAttributePostRequest'
        required: true
      responses:
        "201":
          description: Income attribute created successfully
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/income-attributes/{id}:
    get:
      tags:
        - Income Attributes
      summary: Get income attribute by ID
      operationId: getIncomeAttributeById
      parameters:
        - $ref: '#/components/parameters/IncomeAttributeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeAttributeGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Income Attributes
      summary: Update an income attribute
      operationId: updateIncomeAttribute
      parameters:
        - $ref: '#/components/parameters/IncomeAttributeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeAttributePutRequest'
        required: true
      responses:
        "204":
          description: Income attribute updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Income Attributes
      summary: Delete an income attribute
      operationId: deleteIncomeAttribute
      parameters:
        - $ref: '#/components/parameters/IncomeAttributeId'
      responses:
        "204":
          description: Income attribute deleted successfully
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/incomes:
    get:
      tags:
        - Incomes
      summary: Get list of incomes
      operationId: getIncomes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - description: Filter by year
          in: query
          name: year
          schema:
            format: int32
            maximum: 2200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeListResponse'
          description: Successful response
          headers:
            Link:
              $ref: '#/components/headers/Link'
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Incomes
      summary: Create a new income
      operationId: createIncome
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomePostRequest'
        required: true
      responses:
        "201":
          description: Income created successfully
          headers:
            Location:
              $ref: '#/components/headers/Location'
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/incomes/{id}:
    get:
      tags:
        - Incomes
      summary: Get income by ID
      operationId: getIncomeById
      parameters:
        - $ref: '#/components/parameters/IncomeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Incomes
      summary: Update an income
      operationId: updateIncome
      parameters:
        - $ref: '#/components/parameters/IncomeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomePutRequest'
        required: true
      responses:
        "204":
          description: Income updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Incomes
      summary: Delete an income
      operationId: deleteIncome
      parameters:
        - $ref: '#/components/parameters/IncomeId'
      responses:
        "204":
          description: Income deleted successfully
components:
  schemas:
    AttributeAmountResponse:
      properties:
        amount:
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          type: string
        attribute_name:
          maxLength: 512
          type: string
      required:
        - attribute_id
        - attribute_name
        - amount
      type: object
    AttributeBreakdownResponse:
      properties:
        breakdown:
          description: Per-attribute amounts sorted by amount in descending order. Attributes without data in the period are omitted.
          items:
            $ref: '#/components/schemas/AttributeAmountResponse'
          type: array
        total:
          description: Sum of breakdown amounts
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
      required:
        - total
        - breakdown
      type: object
    BalanceSeriesPointResponse:
      properties:
        expense_total:
          description: Sum of fixed_expense_total and variable_expense_total
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        fixed_expense_total:
          description: Sum of fixed expenses in the bucket
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        income_total:
          description: Sum of incomes in the bucket
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        net:
          description: Net balance, income_total minus expense_total (may be negative)
          format: int64
          maximum: 1000000000000
          minimum: -1000000000000
          type: integer
        period:
          $ref: '#/components/schemas/PeriodResponse'
        variable_expense_total:
          description: Sum of variable expenses in the bucket
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
      required:
        - period
        - income_total
        - fixed_expense_total
        - variable_expense_total
        - expense_total
        - net
      type: object
    BalanceSeriesResponse:
      properties:
        granularity:
          enum:
            - day
            - week
            - month
            - quarter
            - year
          type: string
        items:
          items:
            $ref: '#/components/schemas/BalanceSeriesPointResponse'
          maxItems: 366
          type: array
      required:
        - granularity
        - items
      type: object
    BalanceStatisticsResponse:
      properties:
        expense_total:
          description: Sum of fixed_expense.total and variable_expense.total
          format: int64
          maximum: 1000000000000
          minimum: 0
          type: integer
        fixed_expense:
          $ref: '#/components/schemas/AttributeBreakdownResponse'
        income:
          $ref: '#/components/schemas/AttributeBreakdownResponse'
        net:
          description: Net balance, income.total minus expense_total (may be negative)
          format: int64
          maximum: 1000000000000
          minimum: -1000000000000
          type: integer
        period:
          $ref: '#/components/schemas/PeriodResponse'
        variable_expense:
          $ref: '#/components/schemas/AttributeBreakdownResponse'
      required:
        - period
        - income
        - fixed_expense
        - variable_expense
        - expense_total
        - net
      type: object
    ExpenseAttributeGetResponse:
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        id:
          format: uuid
          maxLength: 36
          type: string
        name:
          maxLength: 512
          type: string
      type: object
    ExpenseAttributeListResponse:
      properties:
        expense_attributes:
          items:
            $ref: '#/components/schemas/ExpenseAttributeGetResponse'
          maxItems: 100
          type: array
      type: object
    ExpenseAttributePostRequest:
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        name:
          maxLength: 512
          type: string
      required:
        - name
        - category
      type: object
    ExpenseAttributePutRequest:
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        name:
          maxLength: 512
          type: string
      required:
        - name
        - category
      type: object
    ExpenseAttributeResponse:
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        id:
          format: uuid
          maxLength: 36
          type: string
        name:
          maxLength: 512
          type: string
      type: object
    ExpenseGetResponse:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        description:
          maxLength: 512
          type: string
        expense_attribute:
          $ref: '#/components/schemas/ExpenseAttributeResponse'
        id:
          format: uuid
          maxLength: 36
          type: string
        payment_date:
          format: date
          maxLength: 10
          type: string
      type: object
    ExpenseListResponse:
      properties:
        expenses:
          items:
            $ref: '#/components/schemas/ExpenseGetResponse'
          maxItems: 100
          type: array
      type: object
    ExpensePostRequest:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          type: string
        description:
          maxLength: 512
          type: string
        payment_date:
          example: "2026-04-10"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - payment_date
        - attribute_id
      type: object
    ExpensePutRequest:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          type: string
        description:
          maxLength: 512
          type: string
        payment_date:
          example: "2026-04-10"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - payment_date
        - attribute_id
      type: object
    IncomeAttributeGetResponse:
      properties:
        id:
          format: uuid
          maxLength: 36
          type: string
        name:
          maxLength: 512
          type: string
      type: object
    IncomeAttributeListResponse:
      properties:
        income_attributes:
          items:
            $ref: '#/components/schemas/IncomeAttributeGetResponse'
          maxItems: 100
          type: array
      type: object
    IncomeAttributePostRequest:
      properties:
        name:
          maxLength: 512
          type: string
      required:
        - name
      type: object
    IncomeAttributePutRequest:
      properties:
        name:
          maxLength: 512
          type: string
      required:
        - name
      type: object
    IncomeAttributeResponse:
      properties:
        id:
          format: uuid
          maxLength: 36
          type: string
        name:
          maxLength: 512
          type: string
      type: object
    IncomeGetResponse:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        description:
          maxLength: 512
          type: string
        id:
          format: uuid
          maxLength: 36
          type: string
        income_attribute:
          $ref: '#/components/schemas/IncomeAttributeResponse'
        receive_date:
          format: date
          maxLength: 10
          type: string
      type: object
    IncomeListResponse:
      properties:
        incomes:
          items:
            $ref: '#/components/schemas/IncomeGetResponse'
          maxItems: 100
          type: array
      type: object
    IncomePostRequest:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          type: string
        description:
          maxLength: 512
          type: string
        receive_date:
          example: "2026-04-25"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - receive_date
        - attribute_id
      type: object
    IncomePutRequest:
      properties:
        amount:
          format: int32
          maximum: 1000000000
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          maxLength: 36
          type: string
        description:
          maxLength: 512
          type: string
        receive_date:
          example: "2026-04-25"
          format: date
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - receive_date
        - attribute_id
      type: object
    PeriodResponse:
      description: Period with inclusive from and to dates
      properties:
        from:
          description: Inclusive start date
          format: date
          type: string
        to:
          description: Inclusive end date
          format: date
          type: string
      required:
        - from
        - to
      type: object
    ProblemDetail:
      description: RFC 9457 Problem Details for HTTP APIs. `instance` is not returned; use `trace_id` to correlate an occurrence.
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem
          example: descriptionは必須入力です
          maxLength: 1024
          type: string
        status:
          description: The HTTP status code
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
        title:
          description: A short, human-readable summary of the problem type
          example: Bad Request
          maxLength: 256
          type: string
        trace_id:
          description: W3C Trace Context trace-id of the request, for correlating the problem with server-side traces (extension member)
          example: 4bf92f3577b34da6a3ce929d0e0e4736
          maxLength: 32
          pattern: ^[0-9a-f]{32}$
          type: string
        type:
          description: A URI reference that identifies the problem type
          example: about:blank
          format: uri
          maxLength: 2048
          type: string
      type: object
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: descriptionは必須入力です
            status: 400
            title: Bad Request
            type: about:blank
    Conflict:
      description: Resource conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 既に登録されています
            status: 409
            title: Conflict
            type: about:blank
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 経費が見つかりません
            status: 404
            title: Not Found
            type: about:blank
    PreconditionFailed:
      description: |
        The `If-Match` condition evaluated to false (RFC 9110 §13.1.1): no listed entity-tag strongly matches the current `ETag` (weak tags never match).
        The client should re-fetch the resource to obtain a fresh `ETag` and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 指定されたバージョンは既に更新されています。最新を取得して再試行してください
            status: 412
            title: Precondition Failed
            type: about:blank
    PreconditionRequired:
      description: The `If-Match` header is missing (RFC 6585 §3). A malformed `If-Match` results in 400.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: If-Matchヘッダーは必須です
            status: 428
            title: Precondition Required
            type: about:blank
