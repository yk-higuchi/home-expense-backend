name: CD
run-name: CD · ${{ github.sha }}
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  set-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Set Version
        id: set-version
        run: |
          echo "version=$(./gradlew --console=plain --no-daemon -q printVersion)" >> "${GITHUB_OUTPUT}"
        working-directory: app
  build-and-push:
    uses: yhiguchi-dev/reusable-workflow/.github/workflows/docker-image.yaml@main
    with:
      build-context: ${{ matrix.build-context }}
      version: ${{ needs.set-version.outputs.version }}
      platform: ${{ matrix.platform }}
      push: true
    needs:
      - set-version
    strategy:
      fail-fast: false
      matrix:
        build-context:
          - app
          - flyway
        platform:
          - linux/amd64
