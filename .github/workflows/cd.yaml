name: Continuous Delivery
run-name: Continuous Delivery · ${{ inputs.version }}
on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      source-sha:
        description: Commit SHA whose tested image (sha-<commit>) is promoted
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      source-sha:
        description: Commit SHA whose tested image (sha-<commit>) is promoted
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  # CI でテスト・スキャン済みのイメージ（sha-<commit>）を、作り直さずに digest のまま
  # バージョンタグと latest に昇格させる。
  promote:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-context:
          - app
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.build-context }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - name: Validate inputs
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: ${VERSION}"; exit 1; }
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid sha: ${SOURCE_SHA}"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested image
        run: |
          source="${IMAGE}:sha-${SOURCE_SHA}"
          source_digest=$(docker buildx imagetools inspect "${source}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "source: ${source}@${source_digest}"
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:latest" "${source}@${source_digest}"
          promoted_digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ "${promoted_digest}" = "${source_digest}" ] || { echo "digest mismatch: ${promoted_digest} != ${source_digest}"; exit 1; }
          echo "### ${IMAGE}:${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "promoted from \`${source}\` (\`${source_digest}\`)" >> "${GITHUB_STEP_SUMMARY}"
  # フロントエンドなどの API 利用側が版を固定して取得できるよう、リリースした版の
  # OpenAPI 定義と、そこから生成した JSON Schema・JTD を GitHub Release に添付する
  # （https://github.com/<repo>/releases/download/v<version>/openapi.yaml, openapi.schema.json, openapi.jtd.json）。
  publish-spec:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate inputs
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: ${VERSION}"; exit 1; }
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid sha: ${SOURCE_SHA}"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
      - name: Check info.version
        run: |
          spec_version=$(yq '.info.version' docs/openapi.yaml)
          [ "${spec_version}" = "${VERSION}" ] || { echo "info.version ${spec_version} != ${VERSION}"; exit 1; }
      - name: Attach openapi.yaml to the release
        run: |
          gh release upload "v${VERSION}" docs/openapi.yaml docs/openapi.schema.json docs/openapi.jtd.json --clobber --repo "${GITHUB_REPOSITORY}"
          echo "### openapi.yaml / openapi.schema.json / openapi.jtd.json attached to v${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
