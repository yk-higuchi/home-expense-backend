name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Start test database (CockroachDB)
        run: scripts/setup_test_db.sh
        env:
          CONTAINER_CLI: docker
      - name: Gradle check
        run: ./gradlew --console=plain --no-daemon -q check
        working-directory: app
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install vacuum
        env:
          VACUUM_VERSION: 0.41.0
        run: |
          curl -fsSL "https://github.com/daveshanley/vacuum/releases/download/v${VACUUM_VERSION}/vacuum_${VACUUM_VERSION}_linux_x86_64.tar.gz" | tar -xz vacuum
          sudo install -m 0755 vacuum /usr/local/bin/vacuum
      - name: Lint OpenAPI
        run: vacuum lint -r .vacuum.yaml -d docs/openapi.yaml
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome check
        run: pnpm biome check .
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commits
        run: pnpm commitlint --from origin/main --to HEAD --verbose
  docker-image-build:
    uses: yhiguchi-dev/reusable-workflow/.github/workflows/docker-image.yaml@main
    with:
      build-context: ${{ matrix.build-context }}
      version: lint
      platform: ${{ matrix.platform }}
    needs:
      - test
    strategy:
      fail-fast: false
      matrix:
        build-context:
          - app
          - flyway
        platform:
          - linux/amd64
